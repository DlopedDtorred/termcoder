[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termcoder"
version = "1.3.0"
description = "Autonomous, professional, and minimalist local software development agent for terminals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dloped", email = "dlopedixorg@gmail.com" }
]
dependencies = [
    "ollama>=0.3.0",
    "rich>=13.0.0"
]

[project.scripts]
termcoder = "termcoder.cli:main"
