[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termcoder"
version = "2.0.0"
description = "Elite autonomous software engineering terminal agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.3.0",
    "rich>=13.0.0",
    "textual>=0.40.0"
]

[project.scripts]
termcoder = "termcoder.cli:main"
